[project]
name = "taleTribe-agents"
version = "0.1.0"
description = "TheTaleTribe AI agent backend"
license = {text = "MIT"}
authors = [
    {name = "Khaled Hossain", email = "khaledhossain.not@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "google-auth>=2.58.0",
    "google-cloud-firestore>=2.31.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "fastapi>=0.141.1",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.3",
    "numpy>=1.24.0",
    "anyio>=4.0.0",
    "tenacity>=8.0.0",
    "structlog>=24.0.0",
    "mcp>=1.29.0,<2.0.0",
    "asyncpg>=0.29.0",
]

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
ruff = "*"
black = "*"
isort = "*"
pre-commit = "^4.6.2"

[tool.poetry.group.local-embeddings]
optional = true

[tool.poetry.group.local-embeddings.dependencies]
sentence-transformers = ">=2.2.0"

[tool.poetry.group.image-gen]
optional = true

[tool.poetry.group.image-gen.dependencies]
torch = ">=2.0.0"
diffusers = ">=0.40.0"
transformers = ">=5.17.0,<6.0.0"
sentencepiece = ">=0.2.2"
Pillow = ">=10.0.0"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
