[project]
name = "novelsync-agents"
version = "0.1.0"
description = "NovelsSync AI agent backend"
license = {text = "MIT"}
authors = [
    {name = "Khaled Hossain", email = "khaledhossain.not@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "google-auth>=2.23.0",
    "google-cloud-firestore>=2.13.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "anyio>=4.0.0",
    "tenacity>=8.0.0",
    "structlog>=24.0.0",
    "mcp>=1.29.0,<2.0.0",
]

[tool.poetry.group.dev.dependencies]
sentence-transformers = ">=2.2.0"
pytest = "*"
pytest-asyncio = "*"
ruff = "*"
black = "*"
isort = "*"
pre-commit = "^4.6.0"

[tool.poetry.group.image-gen]
optional = true

[tool.poetry.group.image-gen.dependencies]
torch = ">=2.0.0"
diffusers = ">=0.21.0"
transformers = ">=4.41.0,<5.0.0"
sentencepiece = ">=0.2.0"
Pillow = ">=10.0.0"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
