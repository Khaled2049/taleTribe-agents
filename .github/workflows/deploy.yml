name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch: null

concurrency:
  group: taleTribe-agents-production
  cancel-in-progress: false
env:
  PROJECT_ID: story-6f89f
  REGION: us-central1
  SERVICE_NAME: novelsync-agents
  ARTIFACT_REGISTRY_REPO: novelsync-agents
  FIREBASE_FUNCTIONS_SA: 793308156964-compute@developer.gserviceaccount.com
  KEEP_IMAGE_COUNT: 3

jobs:
  # pr-check.yml gates the pull-request path, but this workflow is what actually
  # ships, and it fires on every push to main — including a direct push, or a
  # merge made before branch protection is configured. Running the suite here
  # too costs ~1 min and removes the "green PR, untested deploy" gap.
  test:
    name: taleTribe-agents / deploy-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ github.repository }}-py3.11-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        env:
          USE_MOCK: "true"
          GOOGLE_CLOUD_PROJECT: "test-project"

        run: poetry run pytest tests/
  deploy:
    name: taleTribe-agents / deploy-deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2
      - name: Create Artifact Registry repository if needed
        run: |
          # Check if repository exists, if not create it
          if ! gcloud artifacts repositories describe ${ARTIFACT_REGISTRY_REPO} \
            --location=${REGION} >/dev/null 2>&1; then
            echo "Creating Artifact Registry repository..."
            gcloud artifacts repositories create ${ARTIFACT_REGISTRY_REPO} \
              --repository-format=docker \
              --location=${REGION} \
              --description="Docker repository for TheTaleTribe Agents"
          else
            echo "Repository already exists"
          fi

      - name: Apply Artifact Registry cleanup policy
        run: |
          # Keep only the most recent KEEP_IMAGE_COUNT image versions to stop
          # storage from growing forever (each :sha tag pins an immutable digest).
          # The keep policy protects the newest N; the delete policy removes the
          # rest. --no-dry-run makes deletions take effect.
          cat > /tmp/cleanup-policy.json <<EOF
          [
            {
              "name": "keep-recent",
              "action": {"type": "Keep"},
              "mostRecentVersions": {"keepCount": ${KEEP_IMAGE_COUNT}}
            },
            {
              "name": "delete-stale",
              "action": {"type": "Delete"},
              "condition": {"tagState": "ANY"}
            }
          ]
          EOF
          gcloud artifacts repositories set-cleanup-policies ${ARTIFACT_REGISTRY_REPO} \
            --location=${REGION} \
            --policy=/tmp/cleanup-policy.json \
            --no-dry-run

      - name: Create Firestore database if needed
        run: |
          if ! gcloud firestore databases describe --database="(default)" --project=${PROJECT_ID} >/dev/null 2>&1; then
            echo "Creating Firestore (default) database..."
            gcloud firestore databases create --location=${REGION} --type=firestore-native --project=${PROJECT_ID}
          else
            echo "Firestore database already exists"
          fi

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build \
            -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/app:${INPUT_GITHUB_SHA} \
            -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/app:latest \
            .

        env:
          INPUT_GITHUB_SHA: ${{ github.sha }}
      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/app:${INPUT_GITHUB_SHA}
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/app:latest

        env:
          INPUT_GITHUB_SHA: ${{ github.sha }}
      - name: Create or update secret in Secret Manager
        run: |
          if gcloud secrets describe google-ai-studio-api-key --project=${PROJECT_ID} >/dev/null 2>&1; then
            # Only add a new version if the value has changed
            CURRENT=$(gcloud secrets versions access latest --secret=google-ai-studio-api-key --project=${PROJECT_ID} 2>/dev/null || echo "")
            if [ "$CURRENT" != "${INPUT_SECRETS_GOOGLE_AI_STUDIO_API_KEY}" ]; then
              echo "Secret value changed, adding new version..."
              echo "${INPUT_SECRETS_GOOGLE_AI_STUDIO_API_KEY}" | \
                gcloud secrets versions add google-ai-studio-api-key --data-file=-
            else
              echo "Secret value unchanged, skipping"
            fi
          else
            echo "${INPUT_SECRETS_GOOGLE_AI_STUDIO_API_KEY}" | \
              gcloud secrets create google-ai-studio-api-key \
              --data-file=- \
              --replication-policy=automatic
          fi

        env:
          INPUT_SECRETS_GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
      - name: Create Terraform state bucket if needed
        run: |
          BUCKET=story-6f89f-tfstate
          if ! gcloud storage buckets describe gs://$BUCKET >/dev/null 2>&1; then
            echo "Creating GCS bucket for Terraform state..."
            gcloud storage buckets create gs://$BUCKET \
              --location=${REGION} \
              --uniform-bucket-level-access
            gcloud storage buckets update gs://$BUCKET --versioning
          else
            echo "Terraform state bucket already exists"
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Import existing resources if state is empty
        working-directory: ./terraform
        run: |
          # Only run imports if the state is empty (first run with new backend)
          if terraform state list 2>/dev/null | grep -q .; then
            echo "State already populated, skipping imports"
            exit 0
          fi

          echo "Empty state detected — importing existing resources..."
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/app:${INPUT_GITHUB_SHA}"
          SA="novelsync-agents-run@${PROJECT_ID}.iam.gserviceaccount.com"
          IMPORT="terraform import -var=image=$IMAGE"

          $IMPORT google_project_service.run "${PROJECT_ID}/run.googleapis.com" || true
          $IMPORT google_project_service.firestore "${PROJECT_ID}/firestore.googleapis.com" || true
          $IMPORT google_project_service.secretmanager "${PROJECT_ID}/secretmanager.googleapis.com" || true
          $IMPORT google_project_service.artifactregistry "${PROJECT_ID}/artifactregistry.googleapis.com" || true
          $IMPORT google_cloud_run_v2_service.app "projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}" || true
          $IMPORT google_secret_manager_secret_iam_member.secret_access "projects/${PROJECT_ID}/secrets/google-ai-studio-api-key roles/secretmanager.secretAccessor serviceAccount:$SA" || true
          $IMPORT google_project_iam_member.firestore_user "${PROJECT_ID} roles/datastore.user serviceAccount:$SA" || true
          $IMPORT 'google_cloud_run_v2_service_iam_member.public_access[0]' "projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME} roles/run.invoker allUsers" || true

        env:
          INPUT_GITHUB_SHA: ${{ github.sha }}
      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var="image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/app:${INPUT_GITHUB_SHA}" \
            -var="firebase_functions_service_account=${FIREBASE_FUNCTIONS_SA}" \
            -var="assistant_api_enabled=${INPUT_VARS_ASSISTANT_API_ENABLED_TRUE}" \
            -var="assistant_edit_proposals_enabled=${INPUT_VARS_ASSISTANT_EDIT_PROPOSALS_ENABLED_TRUE}" \
            -out=tfplan

        env:
          INPUT_GITHUB_SHA: ${{ github.sha }}
          INPUT_VARS_ASSISTANT_API_ENABLED_TRUE: ${{ vars.ASSISTANT_API_ENABLED || 'true' }}
          INPUT_VARS_ASSISTANT_EDIT_PROPOSALS_ENABLED_TRUE: ${{ vars.ASSISTANT_EDIT_PROPOSALS_ENABLED || 'true' }}
      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Service URL
        id: get_url
        working-directory: ./terraform
        run: |
          SERVICE_URL=$(terraform output -raw service_url)
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Authenticate for health check
        id: auth_health_check
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.get_url.outputs.service_url }}

      - name: Test deployment health check
        env:
          HEALTH_CHECK_TOKEN: ${{ steps.auth_health_check.outputs.id_token }}
          INPUT_STEPS_GET_URL_OUTPUTS_SERVICE_URL: ${{ steps.get_url.outputs.service_url }}
        run: |
          URL="${INPUT_STEPS_GET_URL_OUTPUTS_SERVICE_URL}/health"
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 10 -H "Authorization: Bearer $HEALTH_CHECK_TOKEN" "$URL" > /dev/null; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, waiting 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Test MCP discovery endpoints (unauthenticated)
        run: |
          BASE="${INPUT_STEPS_GET_URL_OUTPUTS_SERVICE_URL}"
          # The MCP server must be reachable without IAM auth: OAuth discovery
          # documents are public, and /mcp must answer 401 (not 403) so MCP
          # clients start the OAuth flow. Failing here usually means the
          # mcp_server/ COPY is missing from the Dockerfile or public access
          # is disabled in Terraform.
          curl -sf --max-time 10 "$BASE/.well-known/oauth-authorization-server" > /dev/null
          curl -sf --max-time 10 "$BASE/.well-known/oauth-protected-resource/mcp" > /dev/null
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -X POST "$BASE/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"ping"}')
          if [ "$STATUS" != "401" ]; then
            echo "Expected 401 from unauthenticated /mcp, got $STATUS"
            exit 1
          fi
          echo "MCP discovery checks passed"

        env:
          INPUT_STEPS_GET_URL_OUTPUTS_SERVICE_URL: ${{ steps.get_url.outputs.service_url }}
      - name: Deployment Summary
        run: |
          echo "## Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service URL:** [${INPUT_STEPS_GET_URL_OUTPUTS_SERVICE_URL}](${INPUT_STEPS_GET_URL_OUTPUTS_SERVICE_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** \`${INPUT_GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${REGION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** [${INPUT_GITHUB_SHA}](${INPUT_GITHUB_SERVER_URL}/${INPUT_GITHUB_REPOSITORY}/commit/${INPUT_GITHUB_SHA})" >> $GITHUB_STEP_SUMMARY
        env:
          INPUT_STEPS_GET_URL_OUTPUTS_SERVICE_URL: ${{ steps.get_url.outputs.service_url }}
          INPUT_GITHUB_SHA: ${{ github.sha }}
          INPUT_GITHUB_SERVER_URL: ${{ github.server_url }}
          INPUT_GITHUB_REPOSITORY: ${{ github.repository }}
permissions:
  contents: read
